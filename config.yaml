---
# =============================================================================
# Profile
# =============================================================================
# Override at runtime: ./setup-mac.sh -p work  or  ansible-playbook ... -e profile=work
# Valid values: personal, work, both

profile: personal

# =============================================================================
# Apps
# =============================================================================

apps_common:
  - bat
  - btop
  - fzf
  - git
  - gpg
  - go
  - node
  - openssl
  - sqlite
  - wget
  - zsh
  - zoxide
  - netscanner
  - ssh-copy-id
  - fastfetch
  - nano
  - tmux

apps_work:
  - powershell

apps_personal:
  - obsidian
  - obs

gui_apps_common:
  - docker
  - firefox

gui_apps_work: []

gui_apps_personal:
  - discord
  - handbrake
  - spotify
  - prismlauncher
#  - davinciresolve # does not exist as a cask. App store version is sandboxed. Get from website.

brew_only_common:
  - oh-my-posh
  - openjdk
  - mas

brew_only_work:
  - meetingbar

brew_only_personal: []

brew_cask_common:
  - visual-studio-code
  - docker
  - xykong/tap/flux-markdown # markdown previewer
  - dockdoor # cmd + tab enhancer
  - iterm2
  - grandperspective # disk usage visualizer
  - linearmouse 
  - wallspace # wallpaper 
  - rectangle # window manager

brew_cask_work:
  - microsoft-edge
  - 1password

brew_cask_personal:
  - jetbrains-toolbox

linux_only_common: []

linux_only_work: []

linux_only_personal: []

homebrew_taps: []

homebrew_cask_appdir: /Applications

# =============================================================================
# Composed variables (consumed by roles — do not rename)
# =============================================================================

_work_apps:          "{{ (profile != 'personal') | ternary(apps_work,           []) }}"
_personal_apps:      "{{ (profile != 'work')     | ternary(apps_personal,       []) }}"
_work_gui:           "{{ (profile != 'personal') | ternary(gui_apps_work,       []) }}"
_personal_gui:       "{{ (profile != 'work')     | ternary(gui_apps_personal,   []) }}"
_work_brew_only:     "{{ (profile != 'personal') | ternary(brew_only_work,      []) }}"
_personal_brew_only: "{{ (profile != 'work')     | ternary(brew_only_personal,  []) }}"
_work_cask:          "{{ (profile != 'personal') | ternary(brew_cask_work,      []) }}"
_personal_cask:      "{{ (profile != 'work')     | ternary(brew_cask_personal,  []) }}"
_work_linux:         "{{ (profile != 'personal') | ternary(linux_only_work,     []) }}"
_personal_linux:     "{{ (profile != 'work')     | ternary(linux_only_personal, []) }}"
_work_mas:           "{{ (profile != 'personal') | ternary(mas_work,            []) }}"
_personal_mas:       "{{ (profile != 'work')     | ternary(mas_personal,        []) }}"

linux_apps:                   "{{ linux_only_common + _work_linux + _personal_linux }}"
homebrew_installed_packages:  "{{ apps_common + _work_apps + _personal_apps + brew_only_common + _work_brew_only + _personal_brew_only }}"
homebrew_cask_apps:           "{{ gui_apps_common + _work_gui + _personal_gui + brew_cask_common + _work_cask + _personal_cask }}"
mas_installed_apps:           "{{ mas_common + _work_mas + _personal_mas }}"

homebrew_cask_accept_external_apps: true
homebrew_upgrade_all_packages: true

# =============================================================================
# Mac App Store
# =============================================================================

mas_upgrade_all_apps: false

mas_common:
  # - {id: 1542271266, name: "Silicon Info"}
  - {id: 425424353,  name: "Unarchiver"}
  - {id: 1640113540, name: "Clone in VS Code"}
  - {id: 497799835,  name: "Xcode"}
  - {id: 1475387142, name: "Tailscale"}
  - {id: 1024640650, name: "CotEditor"} # Notepad++ alternative
  - {id: 1544743900, name: "Hush"} # safari nag blocker
  - {id: 6745342698, name: "uBlock Origin Lite"}
  - {id: 1342896380, name: "Hex Fiend"} # hex editor
  - {id: 1522267256, name: "Shareful"} # share menu customizer

mas_work:
  - {id: 1274495053, name: "Microsoft To Do"}

mas_personal:
  - {id: 1607635845, name: "Velja"} # paid, already bought # quick switch default browser
  - {id: 1444383602, name: "Goodnotes"}
  - {id: 1352778147, name: "Bitwarden"}
  # - {id: 6698876601, name: "Folder Preview"} # paid
  # - {id: 1355679052, name: "Dropover"} # one time in-app purchase # temporary file shelf

# =============================================================================
# Fonts
# =============================================================================

nerdfont_urls:
  - https://github.com/ryanoasis/nerd-fonts/releases/download/v3.2.1/JetBrainsMono.zip
  - https://github.com/ryanoasis/nerd-fonts/releases/download/v3.2.1/Noto.zip

# =============================================================================
# macOS Defaults
# =============================================================================

dock_autohide: true
dock_autohide_delay: 0.05

menu_bar_item_spacing: 8
menu_bar_item_selection_padding: 4

# =============================================================================
# Dock Layout
# =============================================================================

dockutil_install: true

dockitems_remove:
  - Launchpad
  - Apps
  - Mail
  - Maps
  - FaceTime
  - Phone
  - Photos
  - Contacts
  - Reminders
  - TV
  - Music
  - Games
  - 'App Store'

dockitems_persist:
  # Positions are 1-based. Position 1 is Finder by MacOS default.
  - name: System Settings
    path: "/System/Applications/System Settings.app/"
    pos: 2
  - name: Calendar
    path: "/System/Applications/Calendar.app/"
    pos: 3
  - name: Messages
    path: "/System/Applications/Messages.app/"
    pos: 4
  - name: Microsoft Teams
    path: "/Applications/Microsoft Teams.app/"
    pos: 5
  - name: Microsoft Outlook
    path: "/Applications/Microsoft Outlook.app/"
    pos: 6
  - name: Microsoft Edge
    path: "/Applications/Microsoft Edge.app/"
    pos: 7
  - name: Firefox
    path: "/Applications/Firefox.app/"
    pos: 8
  - name: Safari
    path: "/Applications/Safari.app/"
    pos: 9
  - name: Discord
    path: "/Applications/Discord.app/"
    pos: 10
  - name: Spotify
    path: "/Applications/Spotify.app/"
    pos: 11
  - name: Notion
    path: "/Applications/Notion.app/"
    pos: 12
  - name: Obsidian
    path: "/Applications/Obsidian.app/"
    pos: 13
  - name: Notes
    path: "/System/Applications/Notes.app/"
    pos: 14
  - name: Microsoft OneNote
    path: "/Applications/Microsoft OneNote.app/"
    pos: 15
  - name: Microsoft Word
    path: "/Applications/Microsoft Word.app/"
    pos: 16
  - name: Microsoft Excel
    path: "/Applications/Microsoft Excel.app/"
    pos: 17
  - name: Microsoft To Do
    path: "/Applications/Microsoft To Do.app/"
    pos: 18
  # JetBrains Toolbox installs to ~/Applications by default — adjust edition name if needed
  - name: PyCharm
    path: "{{ ansible_facts['env']['HOME'] }}/Applications/PyCharm Professional Edition.app/"
    pos: 19
  - name: IntelliJ IDEA
    path: "{{ ansible_facts['env']['HOME'] }}/Applications/IntelliJ IDEA Ultimate.app/"
    pos: 20
  - name: Visual Studio Code
    path: "/Applications/Visual Studio Code.app/"
    pos: 21
  - name: iTerm2
    path: "/Applications/iTerm.app/"
    pos: 22
  - name: Claude
    path: "/Applications/Claude.app/"
    pos: 23
  - name: iPhone Mirroring
    path: "/System/Applications/iPhone Mirroring.app/"
    pos: 24
  - name: TeamViewer
    path: "/Applications/TeamViewer.app/"
    pos: 25
  - name: 1Password
    path: "/Applications/1Password.app"
    pos: 26


