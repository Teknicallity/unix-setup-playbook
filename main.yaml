---
- name: Computer Setup
  hosts: all

  vars_files:
    - config.yaml
  vars:
    dotfiles_repo: https://github.com/Teknicallity/unix-dotfiles.git

  tasks:
    - name: Set distribution flags
      set_fact:
        is_linux: "{{ ansible_facts['system'] == 'Linux' }}"
        is_mac: "{{ ansible_facts['distribution'] == 'MacOSX' }}"

    - name: Macos Install
      block:
        - name: Install homebrew apps
          include_role:
            name: geerlingguy.mac.homebrew

        - name: Install App Store Apps
          include_role:
            name: geerlingguy.mac.mas

        - name: Check which dock app paths exist
          ansible.builtin.stat:
            path: "{{ item.path }}"
          loop: "{{ dockitems_persist }}"
          loop_control:
            label: "{{ item.name }}"
          register: dock_app_stat_results

        - name: Filter dock items to installed apps only
          ansible.builtin.set_fact:
            dockitems_persist: >-
              {{ (dockitems_persist | zip(dock_app_stat_results.results))
                 | selectattr('1.stat.exists')
                 | map(attribute='0')
                 | list }}

        - name: Configure Dock
          include_role:
            name: geerlingguy.mac.dock

        - name: Apply macOS defaults
          include_role:
            name: mac_defaults

      when: is_mac

    - name: Linux Install
      block:
        - name: Install Packages
          package:
            name: "{{ linux_apps }}"
          become: true
      when: is_linux

    - name: General Install
      block:
        - include_role:
            name: zsh
        - include_role:
            name: nerdfont
